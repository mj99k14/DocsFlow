name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "document-routing/backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1212"
          POSTGRES_DB: document_routing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            document-routing/backend/requirements.txt
            document-routing/backend/requirements-test.txt

      - name: 의존성 설치
        working-directory: document-routing/backend
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: 테스트 실행
        working-directory: document-routing/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: postgresql://postgres:1212@localhost:5432/document_routing_test
        run: pytest -v
